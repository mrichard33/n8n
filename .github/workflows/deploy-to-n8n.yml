name: Deploy workflows to n8n

# Runs automatically when a commit lands on main and touches /workflows.
#
# Only the workflow files CHANGED by that commit are deployed. /workflows has
# drifted from the live instance since 2026-06-22 (every run has failed on an
# empty N8N_API_KEY, so nothing has ever actually deployed), which means a
# whole-directory push would overwrite live definitions with stale ones. See
# scripts/deploy-to-n8n.py for the full reasoning.

on:
  push:
    branches:
      - main
    paths:
      - 'workflows/**'

  # Manual runs default to a dry run. Deploying everything is possible but has
  # to be asked for explicitly, and should not be used until /workflows has been
  # reconciled against live per-workflow.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only — print what would change, write nothing'
        type: boolean
        default: true
      deploy_all:
        description: 'Deploy ALL workflow files (repo is stale vs live — use with care)'
        type: boolean
        default: false

jobs:
  deploy:
    name: Push workflows to n8n instance
    runs-on: ubuntu-latest

    steps:
      # Full history so the push range can be diffed.
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      # Which workflow files did this push actually change? For a first push to
      # a branch, github.event.before is all-zeros and has no diff base, so fall
      # back to the tip commit's own diff.
      - name: Collect changed workflow files
        if: github.event_name == 'push'
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.sha }}^ ${{ github.sha }}"
          else
            RANGE="$BEFORE ${{ github.sha }}"
          fi
          echo "Diffing $RANGE"
          FILES=$(git diff --name-only $RANGE -- 'workflows/*.json' || true)
          echo "Changed workflow files:"
          echo "$FILES"
          {
            echo 'DEPLOY_FILES<<__EOF__'
            echo "$FILES"
            echo '__EOF__'
          } >> "$GITHUB_ENV"

      # An unset secret, a secret added under the Dependabot tab, an Environment
      # secret this job never declares, and an org secret this repo is not
      # granted ALL render as the same empty string — GitHub raises no error for
      # any of them. The deploy then dies with "unset or empty" and cannot say
      # which one it was, which cost a full round trip on 2026-09-04 (run 38,
      # both attempts). This reports visibility only — never the value — so the
      # next failure names its own cause.
      - name: Check the API key is visible to this job
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
        run: |
          if [ -n "$N8N_API_KEY" ]; then
            echo "OK: N8N_API_KEY is visible to this job (${#N8N_API_KEY} chars)."
            exit 0
          fi
          echo "N8N_API_KEY resolved EMPTY for this job."
          echo
          echo "The key existing somewhere is not enough. This job reads a"
          echo "REPOSITORY secret on this repo named exactly N8N_API_KEY."
          echo "All of the following render empty here, with no error:"
          echo "  - added under Settings > Secrets and variables > Dependabot"
          echo "    (wrong tab — it must be the Actions tab)"
          echo "  - an ENVIRONMENT secret (this job declares no environment:)"
          echo "  - an ORGANIZATION secret this repository is not granted"
          echo "  - a secret on a different repository"
          echo "  - a name differing by even one character"
          echo
          echo "Fix: Settings > Secrets and variables > Actions >"
          echo "Repository secrets. The name must appear in THAT list."

      - name: Deploy workflows
        env:
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_BASE_URL: https://n8n-main-instance-production-981e.up.railway.app
          DEPLOY_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          DEPLOY_ALL: ${{ github.event.inputs.deploy_all == 'true' && '1' || '' }}
        run: python scripts/deploy-to-n8n.py
